
<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Nexus People – Spin the Wheel</title>
<style>
  body {
    background: #0A1A2F;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    height: 100vh;
    margin: 0;
    font-family: Arial, sans-serif;
    color: #FFFFFF;
  }

  #logo {
    width: 220px;
    margin-bottom: 20px;
  }

  #wheelContainer {
    position: relative;
    width: 500px;
    height: 500px;
  }

  /* Remove CSS border around SVG so the wheel can truly fill the frame */
  svg {
    border-radius: 50%;
    box-shadow: 0 0 25px rgba(0,0,0,0.4);
    display: block;
  }

  #spinButton {
    margin-top: 25px;
    padding: 15px 40px;
    font-size: 20px;
    background: #00AEEF;
    color: #0A1A2F;
    border: none;
    border-radius: 10px;
    cursor: pointer;
    font-weight: bold;
  }

  #result {
    margin-top: 15px;
    font-size: 20px;
    font-weight: bold;
  }

  /* Ensure the wheel rotates around its true center */
  #wheelGroup {
    transform-origin: 250px 250px;
  }
</style>
</head>
<body>

/attachments/sPv7jaSWqdPwsZY7SbQoH.png

<div id="wheelContainer">
  <!-- SVG draws the white border inside; wheel fills the entire area -->
  <svg id="wheel" width="500" height="500" viewBox="0 0 500 500" aria-label="Spin the Wheel">
    <!-- White ring as part of the SVG (outer edge) -->
    <!-- Full radius is 250; draw a ring from r=240..250 so it looks like a border but doesn't cover slices -->
    <defs>
      <mask id="ringCutout">
        <!-- Mask: white area is visible; black is hidden -->
        <rect x="0" y="0" width="500" height="500" fill="white"/>
        <!-- Punch out the inner part so only a 10px ring remains -->
        <circle cx="250" cy="250" r="240" fill="black"/>
      </mask>
    </defs>

    <!-- The white 10px ring on the outer edge -->
    <circle cx="250" cy="250" r="250" fill="#FFFFFF" mask="url(#ringCutout)"></circle>

    <!-- Everything inside rotates -->
    <g id="wheelGroup"></g>

    <!-- Pointer attached to the white ring.
         Tip sits exactly on the outer edge at y=0 (top center).
         Base is 40px wide and 35px tall. -->
    <polygon id="svgPointer"
             points="250,0 230,35 270,35"
             fill="#FFCC00"
             stroke="#0A1A2F"
             stroke-width="1" />
  </svg>
</div>

<button id="spinButton">SPIN</button>
<div id="result"></div>

<script>
  // ======= Wheel configuration =======
  const prizes = Array.from({ length: 15 }, (_, i) => `Prize ${i + 1}`);
  const colours = ["#00AEEF", "#001B3A"]; // alternate brand colors

  const wheelGroup = document.getElementById("wheelGroup");

  // Geometry
  const cx = 250;
  const cy = 250;
  const outerRadius = 240;   // keep slices inside the white ring (which goes 240..250)
  const textRadius = 150;    // radius for labels
  const sliceAngle = 360 / prizes.length;

  // ======= Build slices & labels =======
  prizes.forEach((label, i) => {
    const start = (i * sliceAngle - 90) * Math.PI / 180;
    const end   = ((i + 1) * sliceAngle - 90) * Math.PI / 180;

    const x1 = cx + Math.cos(start) * outerRadius;
    const y1 = cy + Math.sin(start) * outerRadius;
    const x2 = cx + Math.cos(end)   * outerRadius;
    const y2 = cy + Math.sin(end)   * outerRadius;

    const path = document.createElementNS("http://www.w3.org/2000/svg", "path");
    path.setAttribute("d", `M ${cx} ${cy} L ${x1} ${y1} A ${outerRadius} ${outerRadius} 0 0 1 ${x2} ${y2} Z`);
    path.setAttribute("fill", colours[i % colours.length]);
    path.setAttribute("stroke", "#0A1A2F");
    path.setAttribute("stroke-width", "1");
    wheelGroup.appendChild(path);

    // Label position (mid-angle of slice)
    const mid = ((i + 0.5) * sliceAngle - 90) * Math.PI / 180;
    const tx = cx + Math.cos(mid) * textRadius;
    const ty = cy + Math.sin(mid) * textRadius;

    const text = document.createElementNS("http://www.w3.org/2000/svg", "text");
    text.setAttribute("x", tx);
    text.setAttribute("y", ty);
    text.setAttribute("fill", "#FFFFFF");
    text.setAttribute("font-size", "16");
    text.setAttribute("font-weight", "bold");
    text.setAttribute("text-anchor", "middle");
    text.setAttribute("alignment-baseline", "middle");
    text.setAttribute("transform", `rotate(${(i + 0.5) * sliceAngle}, ${tx}, ${ty})`);
    text.textContent = label;
    wheelGroup.appendChild(text);
  });

  // ======= Spinning behavior =======
  let currentRotation = 0;

  document.getElementById("spinButton").addEventListener("click", () => {
    // Randomise target
    const extra = Math.floor(Math.random() * 360);
    const spins = 10 * 360;
    const target = currentRotation + spins + extra;

    // Duration 4–6s, smooth decel
    const duration = (4 + Math.random() * 2).toFixed(2); // seconds
    wheelGroup.style.transition = `transform ${duration}s cubic-bezier(0.18, 0.9, 0.15, 1)`;
    wheelGroup.style.transform  = `rotate(${target}deg)`;

    currentRotation = target;

    // Determine winning slice at pointer at 0° (top)
    // 0° is at the positive X axis by default, but our build starts from top (-90°),
    // and the pointer is at the top (12 o'clock), so we convert by offsetting with sliceAngle/2
    const final = target % 360;
    const index = Math.floor(((360 - final + sliceAngle / 2) % 360) / sliceAngle);
    const winningPrize = prizes[index];

    setTimeout(() => {
      document.getElementById("result").textContent = `You won: ${winningPrize}`;
    }, duration * 1000);
  });
</script>

</body>
</html>
